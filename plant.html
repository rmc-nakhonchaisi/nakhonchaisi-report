<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บันทึกแอมป์เครื่องโม่ — แพล้นปูน</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Tahoma,sans-serif;background:#f1f5f9;color:#1e293b;padding:16px;}
  .wrap{max-width:460px;margin:0 auto;}
  h1{font-size:18px;font-weight:800;margin:4px 0 2px;color:#0f766e;}
  .sub{font-size:12.5px;color:#64748b;margin-bottom:16px;}
  .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px;}
  label{display:block;font-size:13px;font-weight:600;color:#334155;margin:12px 0 5px;}
  label:first-child{margin-top:0;}
  input[type=date],input[type=time],input[type=number],input[type=text]{
    width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:9px;font-size:15px;outline:none;font-family:inherit;
  }
  input:focus{border-color:#0f766e;}
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;}
  .chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;font-weight:600;color:#334155;}
  .chk input{width:18px;height:18px;}
  button.save{width:100%;margin-top:18px;padding:13px;border:none;border-radius:10px;background:#0f766e;color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
  button.save:disabled{opacity:.5;cursor:default;}
  .msg{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:13px;display:none;}
  .msg.ok{background:#ecfdf5;color:#0f766e;border:1px solid #a7f3d0;display:block;}
  .msg.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;display:block;}
  .hist{font-size:12px;color:#64748b;}
  .hist table{width:100%;border-collapse:collapse;margin-top:6px;}
  .hist th,.hist td{padding:5px 4px;text-align:right;border-bottom:1px solid #f1f5f9;}
  .hist th:first-child,.hist td:first-child{text-align:left;}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚡ บันทึกแอมป์เครื่องโม่</h1>
  <div class="sub">แพล้นปูน นครชัยศรี · กรอกค่าที่อ่านจากมิเตอร์แล้วกด บันทึก</div>

  <div class="card">
    <div class="row2">
      <div>
        <label>วันที่</label>
        <input type="date" id="f_date">
      </div>
      <div>
        <label>เวลา</label>
        <input type="time" id="f_time">
      </div>
    </div>

    <label>สูตร</label>
    <input type="text" id="f_formula" list="formulaList" placeholder="เช่น NP325">
    <datalist id="formulaList">
      <option value="PC310 I-15,18"><option value="PC320 I-15,18"><option value="PC330 I-15,18">
      <option value="PC310 I-22,26"><option value="PC320 I-22,26"><option value="PC330 I-22,26">
    </datalist>

    <label>แอมป์ (A)</label>
    <input type="number" id="f_amp" step="0.01" placeholder="เช่น 53.9" inputmode="decimal">

    <div class="row2">
      <div>
        <label>ความชื้นทราย (%)</label>
        <input type="number" id="f_moisture" step="0.01" placeholder="ไม่บังคับ" inputmode="decimal">
      </div>
      <div>
        <label>น้ำที่เติม (ลิตร)</label>
        <input type="number" id="f_water" step="0.1" placeholder="ไม่บังคับ" inputmode="decimal">
      </div>
    </div>

    <label>หมายเหตุ</label>
    <input type="text" id="f_note" placeholder="ไม่บังคับ">

    <label class="chk"><input type="checkbox" id="f_collected"> เก็บก้อนตัวอย่างไว้</label>

    <button class="save" id="btnSave">บันทึก</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card hist">
    <b style="color:#1e293b;font-size:13px;">รายการล่าสุด</b>
    <table id="histTable"><tbody></tbody></table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mfeuofyhssimjgoztuzi.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mZXVvZnloc3NpbWpnb3p0dXppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NTgzODksImV4cCI6MjA5NzIzNDM4OX0.OA9i8FXlOsmy3CF4TY8tZZHIAe5iNItDjZP3CWyD2wA';
const DB = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function pad(n){return String(n).padStart(2,'0');}
function setDefaults(){
  const now=new Date();
  document.getElementById('f_date').value = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  document.getElementById('f_time').value = pad(now.getHours())+':'+pad(now.getMinutes());
}
setDefaults();

async function loadHistory(){
  const {data} = await DB.from('plant_amp_log').select('*').order('sample_date',{ascending:false}).order('sample_time',{ascending:false}).limit(8);
  const tbody=document.querySelector('#histTable tbody');
  tbody.innerHTML='';
  (data||[]).forEach(r=>{
    const tr=document.createElement('tr');
    tr.innerHTML = `<td>${r.sample_date.slice(8,10)}/${r.sample_date.slice(5,7)} ${String(r.sample_time||'').slice(0,5)}</td><td>${r.formula||''}</td><td><b style="color:#0f766e">${Number(r.amp).toFixed(2)}</b></td>`;
    tbody.appendChild(tr);
  });
}
loadHistory();

document.getElementById('btnSave').addEventListener('click', async ()=>{
  const msg=document.getElementById('msg');
  msg.className='msg';
  const date=document.getElementById('f_date').value;
  const time=document.getElementById('f_time').value;
  const formula=document.getElementById('f_formula').value.trim();
  const amp=document.getElementById('f_amp').value;
  if(!date||!time||!formula||!amp){
    msg.className='msg err'; msg.textContent='กรอก วันที่ / เวลา / สูตร / แอมป์ ให้ครบก่อนครับ';
    return;
  }
  const btn=document.getElementById('btnSave');
  btn.disabled=true; btn.textContent='กำลังบันทึก...';
  const moisture=document.getElementById('f_moisture').value;
  const water=document.getElementById('f_water').value;
  const note=document.getElementById('f_note').value.trim();
  const collected=document.getElementById('f_collected').checked;
  const {error} = await DB.from('plant_amp_log').insert({
    sample_date:date, sample_time:time, formula,
    amp:Number(amp),
    sand_moisture_pct: moisture!==''?Number(moisture):null,
    water_added: water!==''?Number(water):null,
    note: note||null,
    sample_collected: collected,
  });
  btn.disabled=false; btn.textContent='บันทึก';
  if(error){
    msg.className='msg err'; msg.textContent='บันทึกไม่สำเร็จ: '+error.message;
    return;
  }
  msg.className='msg ok'; msg.textContent='✅ บันทึกแล้ว';
  document.getElementById('f_amp').value='';
  document.getElementById('f_moisture').value='';
  document.getElementById('f_water').value='';
  document.getElementById('f_note').value='';
  document.getElementById('f_collected').checked=false;
  setDefaults();
  loadHistory();
});
</script>
</body>
</html>
